<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buổi 2 - Bài 1: Đăng ký khóa học</title>
<style>
body { font-family: Arial, sans-serif; background: #fafafa; margin: 0; padding: 24px; }
form { max-width: 480px; margin: 0 auto; background: #fff; padding: 20px 24px; border-radius: 8px; }
fieldset { border: 1px solid #ddd; border-radius: 6px; padding: 16px 20px; }
legend { font-weight: bold; padding: 0 8px; }
label { font-weight: bold; }
input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc;
border-radius: 4px; }
input[type="range"] { padding: 0; }
p { margin: 14px 0; }

button { 
  width: 100%; 
  padding: 12px; 
  margin-top: 16px; 
  background: #3498db; 
  color: #fff; 
  border: none; 
  border-radius: 6px; 
  font-size: 16px; 
  cursor: pointer; 
}
button:hover { background: #2980b9; }
output { font-weight: bold; color: #3498db; }
</style>
</head>
<body>
<h1 style="text-align:center;">Đăng ký khóa học</h1>
<!-- Toàn bộ validate dưới đây dùng thuần HTML5 (required, pattern, min/max),
KHÔNG cần 1 dòng JavaScript nào -->

<form action="#" method="post">
<fieldset>
<legend>Thông tin đăng ký</legend>
<p>
<label for="hoten">Họ và tên: <span style="color:red">*</span></label>
<input type="text" id="hoten" name="hoten" placeholder="Nguyễn Văn A"
required autofocus>

</p>
<p>
<label for="email">Email: <span style="color:red">*</span></label>
<input type="email" id="email" name="email"
placeholder="ten@example.com" required>

</p>
<p>
<label for="phone">Số điện thoại: <span style="color:red">*</span></label>
<input type="tel" id="phone" name="phone"
pattern="[0-9]{10}" title="Nhập đúng 10 số điện thoại"
placeholder="0912345678" required>

</p>
<p>
<label for="birthday">Ngày sinh:</label>
<input type="date" id="birthday" name="birthday" max="2026-08-14">
</p>
<p>
<label for="khoahoc">Khóa học quan tâm:</label>
<input type="text" id="khoahoc" name="khoahoc" list="khoahoc-list"
placeholder="Chọn hoặc tự nhập...">

<datalist id="khoahoc-list">
<option value="HTML5 &amp; CSS3">
<option value="JavaScript cơ bản">
<option value="Lập trình PHP">
<option value="Thiết kế UI/UX">
</datalist>
</p>
<p>
<label for="soubuoi">Số buổi muốn học mỗi tuần:</label><br>
<input type="range" id="soubuoi" name="soubuoi" min="1" max="7" value="3"
oninput="ketqua.value = soubuoi.value">
<output name="ketqua" for="soubuoi">3</output> buổi/tuần
</p>
<p>
<label for="ngansach">Ngân sách dự kiến (đồng):</label><br>
<input type="range" id="ngansach" name="ngansach" min="500000" max="10000000"
step="500000" value="2000000"
oninput="ketquaNganSach.value = Number(ngansach.value).toLocaleString('vi-VN')">
<output name="ketquaNganSach" for="ngansach">2.000.000</output>đ
</p>
<p>
<label for="ghichu">Ghi chú thêm:</label>
<textarea id="ghichu" name="ghichu" rows="3"

placeholder="Ví dụ: buổi tối trong tuần, cuối tuần..."></textarea>

</p>
</fieldset>
<button type="submit">Đăng ký ngay</button>
</form>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buổi 2 - Bài 2: Đặt bàn nhà hàng</title>
<style>
body { font-family: Arial, sans-serif; background: #fafafa; margin: 0; padding: 24px; }
form { max-width: 480px; margin: 0 auto; background: #fff; padding: 20px 24px; border-radius: 8px; }
fieldset { border: 1px solid #ddd; border-radius: 6px; padding: 16px 20px; }
legend { font-weight: bold; padding: 0 8px; }
label { font-weight: bold; }
input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc;
border-radius: 4px; }
p { margin: 14px 0; }

button { 
  width: 100%; 
  padding: 12px; 
  margin-top: 16px; 
  background: #3498db; 
  color: #fff; 
  border: none; 
  border-radius: 6px; 
  font-size: 16px; 
  cursor: pointer; 
}

button:hover { background: #219150; }
meter { width: 100%; height: 22px; }
.ghi-chu-ban { font-size: 14px; color: #555; }
</style>
</head>
<body>
<h1 style="text-align:center;">Đặt bàn nhà hàng</h1>

<form action="#" method="post">
<fieldset>
<legend>Thông tin đặt bàn</legend>
<p>
<label for="hoten">Họ và tên: <span style="color:red">*</span></label>
<input type="text" id="hoten" name="hoten" placeholder="Nguyễn Văn A" required>
</p>
<p>
<label for="phone">Số điện thoại: <span style="color:red">*</span></label>
<input type="tel" id="phone" name="phone"
pattern="[0-9]{10}" title="Nhập đúng 10 số điện thoại"
placeholder="0912345678" required>

</p>
<p>
<label for="ngaydat">Ngày đặt bàn: <span style="color:red">*</span></label>
<input type="date" id="ngaydat" name="ngaydat" min="2026-08-14" required>
</p>
<p>
<label for="giodat">Giờ đặt bàn: <span style="color:red">*</span></label>
<input type="time" id="giodat" name="giodat" min="10:00" max="22:00" required>
</p>
<p>
<label for="soluongkhach">Số lượng khách:</label>
<input type="number" id="soluongkhach" name="soluongkhach" min="1" max="20" value="2">
</p>

<!-- meter: đo 1 giá trị TĨNH có ý nghĩa tốt/xấu (số bàn còn trống),
KHÁC với progress (dùng cho việc đang diễn ra và sẽ hoàn thành) -->
<p>
<label for="banconso">Số bàn còn trống hôm nay:</label><br>
<meter id="banconso" value="5" min="0" max="20" low="5" high="15" optimum="20">
5/20 bàn
</meter>
<p class="ghi-chu-ban">5/20 bàn — nên đặt sớm nếu đi vào giờ cao điểm.</p>
</p>
<p>
<label for="yeucau">Yêu cầu đặc biệt:</label>
<textarea id="yeucau" name="yeucau" rows="3"

placeholder="Ví dụ: bàn gần cửa sổ, có ghế trẻ em..."></textarea>

</p>
</fieldset>
<button type="submit">Xác nhận đặt bàn</button>
</form>
</body>
</html>
